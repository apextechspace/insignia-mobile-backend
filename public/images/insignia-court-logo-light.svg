<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', 'Times New Roman', serif;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.14em;
      }
      .brand-sub {
        font-family: 'Cinzel', 'Times New Roman', serif;
        font-weight: 600;
        fill: #E4A9C3;
        letter-spacing: 0.28em;
      }
      .brand-bar {
        fill: #E4A9C3;
      }
    </style>
  </defs>

  <!-- TOP LINE: "INSIGNIA COURTS" in authentic brand serif (light) -->
  <text x="310" y="62" text-anchor="middle" class="brand-title" font-size="50">INSIGNIA COURTS</text>

  <!-- REFINED ROSE-GOLD DIVIDER BAR -->
  <rect x="70" y="84" width="480" height="3" rx="1.5" class="brand-bar" />

  <!-- BOTTOM LINE: "WUSE II · ABUJA" in matching serif (light) -->
  <text x="310" y="118" text-anchor="middle" class="brand-sub" font-size="20">WUSE II &middot; ABUJA</text>
</svg>
